<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#lmap{height:min(64vh,480px);min-height:340px;isolation:isolate;z-index:0}
.lmkw{background:none!important;border:0!important}
.lmw{display:flex;align-items:center;white-space:nowrap;width:max-content;transform:translate(-12px,-50%)}
.lmw.left{flex-direction:row-reverse;transform:translate(calc(-100% + 12px),-50%)}
.lmk{flex:none;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:12px;color:#fff;font:700 12px/20px "IBM Plex Mono",ui-monospace,monospace;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.lmk.sel{box-shadow:0 0 0 3px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.45)}
.lml{flex:none;margin:0 4px;max-width:14em;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.94);color:#1b1f23;border:1px solid rgba(0,0,0,.22);border-radius:6px;padding:0 6px;font:600 12px/18px "Noto Sans TC",system-ui,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hidelab .lml{display:none}
.hidelab .lmw.selw .lml{display:block}
.leaflet-container{font-family:inherit}
</style>

<body>
<title>仙台・山形・會津 秋旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column. Sticky header with day strip, vertical timeline (time rail · node line · card), fixed bottom tab bar. */
:root{
  --bg:#EEF1F0;          /* cool washi, slight moss bias */
  --surface:#FFFFFF;
  --surface-2:#E3E8E7;
  --ink:#1B2731;         /* 藍墨 */
  --muted:#5A6A73;
  --line:#CBD3D3;
  --ai:#25486F;          /* 藍 indigo — interactive */
  --ai-soft:#DCE6F1;
  --momiji:#B03A2C;      /* 紅葉 — sparing accent */
  --momiji-soft:#F5E1DC;
  --kin:#A26A12;         /* 金 — caution */
  --kin-soft:#F4E8CF;
  --mountain-1:#C9D3D6; --mountain-2:#A9B8BE; --mountain-3:#7F939C;
  --d1:#2C6AAE;--d2:#B8372A;--d3:#C9741C;--d4:#21867A;--d5:#7351A0;--d6:#4F7F22;--d7:#AE3F74;--d8:#5B6B78;
  --land:#E6EAE5;--sea:#C9DBE6;--mtn:#B7C2BC;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B;--surface:#17212A;--surface-2:#1F2B36;--ink:#E4E9EC;--muted:#97A6AE;--line:#2C3A46;
  --ai:#8DB3E2;--ai-soft:#1D3048;--momiji:#E8806C;--momiji-soft:#3A2420;--kin:#E2B45E;--kin-soft:#36291A;
  --mountain-1:#1C2731;--mountain-2:#243341;--mountain-3:#2F4252;--d1:#6FA6E6;--d2:#EC7D6C;--d3:#F0A65A;--d4:#5CC2B3;--d5:#B097DB;--d6:#93C46A;--d7:#E785B5;--d8:#A2B2BE;--land:#1A242C;--sea:#13222F;--mtn:#2E3D47;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B;--surface:#17212A;--surface-2:#1F2B36;--ink:#E4E9EC;--muted:#97A6AE;--line:#2C3A46;
  --ai:#8DB3E2;--ai-soft:#1D3048;--momiji:#E8806C;--momiji-soft:#3A2420;--kin:#E2B45E;--kin-soft:#36291A;
  --mountain-1:#1C2731;--mountain-2:#243341;--mountain-3:#2F4252;--d1:#6FA6E6;--d2:#EC7D6C;--d3:#F0A65A;--d4:#5CC2B3;--d5:#B097DB;--d6:#93C46A;--d7:#E785B5;--d8:#A2B2BE;--land:#1A242C;--sea:#13222F;--mtn:#2E3D47;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--ai)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.hero{position:relative;overflow:hidden;margin-inline:-16px;padding:20px 16px 0;}
.hero svg.mtn{position:absolute;inset:auto 0 0 0;width:100%;height:86px;display:block}
.hero-inner{position:relative;padding-bottom:58px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1.15;margin:4px 0 6px;text-wrap:balance;letter-spacing:.02em}
.hero h1 .dot{color:var(--momiji)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.count{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--f-mono);font-weight:600;color:var(--momiji)}
.count b{font-size:22px}

/* ---------- day strip ---------- */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-width:58px;text-align:center;cursor:pointer}
.dchip .n{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.dchip .d{display:block;font-family:var(--f-mono);font-weight:600;font-size:15px}
.dchip .w{font-size:11px;color:var(--muted)}
.dchip[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.dchip[aria-selected="true"] .n,.dchip[aria-selected="true"] .w{color:inherit;opacity:.85}
.dchip.today{box-shadow:inset 0 -3px 0 var(--momiji)}

/* ---------- day head ---------- */
.dayhead{padding:18px 0 6px}
.dayhead .no{font-family:var(--f-mono);font-size:12px;color:var(--momiji);letter-spacing:.1em}
.dayhead h2{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.25;margin:2px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--ink)}
.fact svg{width:14px;height:14px;flex:none}
.lead{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* segmented control */
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin:14px 0 4px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700;color:var(--ai)}
.seg-note{font-size:12.5px;color:var(--muted);margin:4px 0 0}

.callout{border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:12px 0 0;background:var(--kin-soft);color:var(--ink)}
.callout b{color:var(--kin)}
.callout.blue{background:var(--ai-soft)}
.callout.blue b{color:var(--ai)}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
.row{display:grid;grid-template-columns:50px 18px minmax(0,1fr);column-gap:8px;align-items:start;position:relative}
.time{font-family:var(--f-mono);font-weight:600;font-size:13px;text-align:right;padding-top:13px;font-variant-numeric:tabular-nums;line-height:1.2}
.time small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.node{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ai);margin:16px 0 0 3px;position:relative;z-index:1}
.row.key .node{background:var(--momiji);border-color:var(--momiji)}
.card{background:var(--surface);border-radius:var(--r);padding:12px 12px 10px;margin:6px 0;border:1px solid var(--line);min-width:0}
.row.key .card{border-color:color-mix(in srgb,var(--momiji) 45%,var(--line))}
.ctitle{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.ctitle h3{margin:0;font-size:16px;font-weight:700;line-height:1.35;text-wrap:balance}
.dur{flex:none;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:6px;margin-top:2px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:5px;margin-bottom:4px;background:var(--ai-soft);color:var(--ai);font-weight:700}
.tag.food{background:var(--momiji-soft);color:var(--momiji)}
.tag.stay{background:var(--surface-2);color:var(--ink)}
.tag.opt{background:var(--kin-soft);color:var(--kin)}
.sub{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.places{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.places li{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.places li{flex-wrap:wrap}
.places li.sub{margin-left:16px;border-top:0;padding-top:0;background:var(--momiji-soft);border-radius:8px;padding:6px 8px}
.places li .arr{color:var(--muted);font-weight:400}
.places li span{min-width:0}
.places li .pbtns{display:flex;gap:6px;flex:none}
.places li .panel{flex:0 0 100%;margin-top:2px}
.places li em{font-style:normal;color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2}
.btn svg{width:15px;height:15px;flex:none}
.btn.nav{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.btn.mini{padding:4px 8px;font-size:12px;font-weight:600;flex:none}
.btn.mc{border-style:dashed;background:var(--bg);color:var(--ink)}
.btn.mc b{font-weight:700;letter-spacing:.2px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ctop .tag{margin-bottom:4px;flex:none;white-space:nowrap;align-self:flex-start}
.ctop2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.ctop2 .cl{min-width:0}
.ctop2 .ctitle{display:block}
.ctop2 .ctitle .dur{display:inline-block;margin-top:5px;white-space:normal;max-width:100%}
.dur .nw{white-space:nowrap}
.btn.mc.two{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:2px 7px;line-height:1.3}
.btn.mc.two .l{font-size:10px;font-weight:500;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mccol{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.mccol .btn.mc.top{margin-bottom:0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn.mc.top{padding:1px 7px;font-size:11px;font-weight:600;border-radius:6px;margin-bottom:4px;line-height:1.5;min-height:0;max-width:100%}
.mcode{display:inline-block;margin-left:2px;padding:0 6px;border:1px dashed var(--line);border-radius:6px;font-size:12px;white-space:nowrap;color:var(--muted)}
.mcode b{color:var(--ink)}
.btn[aria-expanded="true"]{background:var(--surface-2)}
.btn.i svg{color:var(--ai)} .btn.p svg{color:var(--kin)}
.panel{margin-top:8px;border-radius:9px;padding:9px 11px;font-size:13.5px;line-height:1.65}
.panel.i{background:var(--ai-soft)}
.panel.p{background:var(--kin-soft)}
.panel.a{background:var(--momiji-soft)}
.panel.a .ph{color:var(--momiji)}
.btn.a svg{color:var(--momiji)}
.btn.k .mp{font-size:13px;line-height:1}
.panel.k{background:var(--momiji-soft);border-left:3px solid var(--momiji)}
.panel.k .ph{color:var(--momiji)}
.panel.k .actions{flex-wrap:wrap}
.panel.k .src{font-size:12px;color:var(--muted);margin-top:6px}
.btn.photo{background:var(--surface);font-weight:600}
.btn.photo svg{color:var(--momiji)}
.pick{margin-top:8px}
.pick b{font-size:12px;letter-spacing:.06em;color:var(--momiji)}
.pick ul{margin:2px 0 0;padding-left:18px}
.pick li+li{margin-top:2px}
.panel .actions{margin-top:8px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:2px 0 10px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 86%;margin:0;scroll-snap-align:start;min-width:0}
.gal.one figure{flex-basis:100%}
.gal .zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden}
.gal img{display:block;width:100%;max-width:100%;max-height:420px;object-fit:cover}
.gal{align-items:flex-start}
.gal figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,12,16,.92);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox p{color:#E4E9EC;font-size:13px;margin:10px 0 0;text-align:center}
.lightbox .lbbox{max-width:min(100%,1100px);text-align:center}
.lbnav,.lbx{position:fixed;z-index:3;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font:inherit;line-height:1}
.lbnav{top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;font-size:34px}
.lbnav.prev{left:10px}.lbnav.next{right:10px}
.lbx{top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:50%;font-size:20px}
.lbnav:hover,.lbx:hover{background:rgba(255,255,255,.3)}
.lbnav[hidden]{display:none}
.galw{position:relative}
/* 照片讀取中的骨架 */
@keyframes skel{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.gal .zoom{position:relative;background:var(--surface-2)}
.gal .zoom img{position:relative;z-index:1;opacity:0;transition:opacity .25s}
.gal .zoom img.ok{opacity:1}
.gal .zoom::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 25%,color-mix(in srgb,var(--ink) 9%,transparent) 50%,transparent 75%);background-size:200% 100%;animation:skel 1.3s linear infinite}
.gal .zoom::after{content:"照片讀取中…";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.gal .zoom.ok::before,.gal .zoom.ok::after{display:none}
.gal .zoom.err::before{animation:none}
.gal .zoom.err::after{content:"照片載入失敗，有網路後再試"}
.wxthumb img:not(.ok){background:linear-gradient(90deg,#e8ecef 25%,#f6f8f9 50%,#e8ecef 75%);background-size:200% 100%;animation:skel 1.3s linear infinite}
.lightbox.ld .lbbox img{opacity:0}
.lightbox.ld::after{content:"";position:fixed;left:50%;top:calc(50% - 50px);width:38px;height:38px;margin:-19px 0 0 -19px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.lightbox.err .lbbox img{display:none}
.lightbox.err::after{content:"照片載入失敗，有網路後再試";position:fixed;left:0;right:0;top:calc(50% - 44px);text-align:center;color:#fff;font-size:15px;font-weight:700}
@media (prefers-reduced-motion:reduce){.gal .zoom::before,.wxthumb img,.lightbox.ld::after{animation:none!important}}
.galnav{display:none;position:absolute;top:calc(50% - 14px);transform:translateY(-50%);z-index:2;width:36px;height:56px;border:0;border-radius:10px;background:rgba(15,20,25,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;place-items:center}
.galnav.prev{left:6px}.galnav.next{right:6px}.galnav:hover{background:rgba(15,20,25,.8)}
.gal img{-webkit-user-drag:none;user-select:none}
@media (hover:hover) and (pointer:fine){
 .galnav{display:grid}
 .gal,.days{scrollbar-width:thin}
 .gal::-webkit-scrollbar,.days::-webkit-scrollbar{display:block;height:8px}
 .gal::-webkit-scrollbar-thumb,.days::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
 .gal,.days{cursor:grab}
 .gal .zoom{cursor:zoom-in}
 .mchips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
 .mchip:hover{border-color:var(--ink)}
}
.panel p{margin:0}.panel p+p{margin-top:6px}
.panel .ph{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:4px}
.panel.i .ph{color:var(--ai)} .panel.p .ph{color:var(--kin)}
.panel .ph svg{width:14px;height:14px}

/* move rows */
.row.move .time{color:var(--muted);font-weight:500;font-size:12px;padding-top:9px}
.mv{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:6px 0;font-size:13px;color:var(--muted);min-width:0}
.mv .mode{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);background:var(--surface-2);border-radius:999px;padding:2px 9px 2px 6px;font-size:12px;white-space:nowrap}
.mv .mode svg{width:15px;height:15px}
.row.move .node{width:22px;height:22px;margin:4px 0 0 -2px;border:0;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.row.move .node svg{width:14px;height:14px}

/* choice groups */
.choice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:6px 0;overflow:hidden;min-width:0}
.choice-h{padding:10px 12px 0}
.choice-h h3{margin:0;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.opts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.optbody{padding:10px 12px 12px}
.card.nested{margin:0;border:0;padding:0;background:transparent}
.optbody>.card.nested+.card.nested{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.mv.nm{padding:8px 0 8px 8px;margin:6px 0;border-left:2px dotted var(--line)}
.subspots{display:grid;gap:12px;margin:10px 0 4px}
.subspot{border-left:3px solid var(--d6,var(--line));padding:2px 0 2px 10px}

/* ---------- generic sections ---------- */
.sec{padding-top:18px}
.sec h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0 0 4px}
.sec h3{font-size:15px;margin:22px 0 8px;letter-spacing:.04em}
.sec .lead{margin-top:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin:8px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.stack{display:grid;gap:10px}
.flight{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.flight .ap{font-family:var(--f-mono);font-size:22px;font-weight:600}
.flight .tm{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.flight .line{color:var(--muted);font-size:12px}
.flight .line svg{width:22px;height:22px;color:var(--ai)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cardhead h4{margin:0;font-size:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500}
.pill.warn{background:var(--kin-soft);color:var(--kin);font-weight:700}
.pill.ok{background:var(--ai-soft);color:var(--ai);font-weight:700}

.dayblock{margin-top:14px}
.dayblock .dh{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.dayblock .dh b{font-family:var(--f-mono);color:var(--ink);font-size:14px}
.mlist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.mlist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0 5px 12px;font-size:13px;min-width:0}
.mlist .mt{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;width:40px}
.mlist .mode{flex:none}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.check li label{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ai);flex:none}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .3s}
ul.plain{margin:0;padding-left:18px;font-size:14px}
ul.plain li+li{margin-top:6px}

/* budget */
.total{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total .box .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.total .box .big{font-family:var(--f-mono);font-weight:600;font-size:24px;line-height:1.2;margin-top:2px}
.total .box .big small{font-size:13px;color:var(--muted);font-weight:500}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 8px;gap:2px}
.split i{display:block;height:100%}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-size:13px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend li b{width:12px;height:12px;border-radius:3px;display:block}
.legend .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
tr.sum td{font-weight:700;border-bottom:0;background:var(--surface-2)}
tr.sum td:first-child{background:var(--surface-2)}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{display:grid;justify-items:center;gap:2px;border:0;background:transparent;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ai);font-weight:700}
.tab[aria-selected="true"] svg{color:var(--momiji)}

.mchips{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-family:var(--f-mono)}
.mchip i,.dsw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.mapbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--land)}
.mapsvg{display:block;width:100%;height:auto;max-width:100%}
.mapsvg .m-pref{font-size:13px;fill:var(--muted);opacity:.55;letter-spacing:.3em;font-weight:700}
.mapsvg .m-peak{font-size:9.5px;fill:var(--muted)}
.mapsvg .m-town{font-size:11px;fill:var(--ink);font-weight:700}
.mapsvg .m-num{font-size:11.5px;fill:#fff;font-weight:700;font-family:var(--f-mono);pointer-events:none}
.mapsvg .mk{cursor:pointer}
.mapsel{margin-top:10px;border-width:2px}
.mlist2{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mlist2 li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.mlist2 li.on{background:var(--surface-2);border-radius:8px}
.mlist2 .no{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font:700 11.5px/22px var(--f-mono);text-align:center}
.mlist2 .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-size:14px;cursor:pointer}
.mlist2 .nm em{font-style:normal;color:var(--muted);font-size:12px}
.legend2{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.legend2 button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;font-size:13.5px;cursor:pointer}
.legend2 b{font-size:12.5px}
.foot{font-size:12px;color:var(--muted);margin:28px 0 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.wx{margin:12px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wx>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.wx>summary::-webkit-details-marker{display:none}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary span{display:grid;gap:3px;min-width:0}.fold>summary b{font-size:15px}
.fold>summary small{font-size:12.5px;color:var(--muted);line-height:1.4}
.fold .chev{flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.fold[open] .chev{transform:rotate(-135deg)}
.wx>summary svg.wxs{width:38px;height:18px;flex:0 0 auto}
.wx>summary .wxg{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.wx>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-3px 2px 0 4px;flex:0 0 auto;transition:transform .15s}
.wx[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.wxb{padding:0 12px 8px}
.wxh{font-size:12.5px;font-weight:700;color:var(--muted);margin:8px 0 0;letter-spacing:.04em}
.wxr{display:grid;grid-template-columns:minmax(0,1fr) auto 62px 56px;gap:6px 8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.wxb>.wxr:first-child,.wxh+.wxr{border-top:0}
.wxl b{display:block;font-size:13.5px}.wxl span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.3}.wxl em{display:block;font-style:normal;font-size:12px;color:#c2570c;margin-top:1px;line-height:1.3}
.wxi{display:flex;gap:0;justify-content:center}.wxi svg{width:46px;height:22px}
.wxp{text-align:center;font-size:14px;font-weight:700;border-radius:8px;padding:5px 0;line-height:1.1}.wxp small{display:block;font-size:10.5px;font-weight:500;margin-top:1px}
.wxt{text-align:center;font-size:12.5px;line-height:1.35}.wxt b{display:block;font-size:13px}.wxt span{color:var(--muted)}.wxt span.hi{color:#c2570c;font-weight:700}
.wxn{font-size:11.5px;color:var(--muted);margin:2px 0 4px;line-height:1.5}
.wxo{margin-top:12px;display:grid;gap:8px}
.wxo details.wx{margin:0}
.wxo summary{display:grid;grid-template-columns:42px minmax(0,1fr) 46px 54px 12px;gap:8px;align-items:center;padding:10px 12px;font-weight:400}
.wxo summary::after{display:none}
.wxd{text-align:center;line-height:1.2}.wxd b{display:block;font-size:13px}.wxd span{font-size:11.5px;color:var(--muted)}
.wxm b{display:block;font-size:14px;line-height:1.3}.wxm span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.35}.wxm small.wxv{display:inline;font-size:11px;font-weight:600;color:var(--ai);margin-left:6px}
.wxm i.hi{font-style:normal;color:#c2570c;font-weight:700}
.wxo .chev{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.wxo details[open] .chev{transform:rotate(-135deg)}
.wxo summary svg.wxs{width:46px;height:22px}
.wxc{margin:8px 0 2px;padding:9px 11px;border-radius:10px;background:var(--ai-soft);font-size:13px;line-height:1.6}.wxc b{display:block;font-size:12.5px;color:var(--ai);margin-bottom:1px}.wxc.tips{margin-top:8px}.wxc.tips p{margin:0 0 6px}.wxc.tips p:last-child{margin:0}
.wxthumb{display:flex;gap:12px;align-items:center;width:100%;margin:12px 0 0;padding:10px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:zoom-in;font:inherit}
.wxthumb img{flex:0 0 auto;width:74px;height:96px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);background:#fff}
.wxthumb span{display:grid;gap:3px;min-width:0}.wxthumb b{font-size:15px}.wxthumb em{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.4}.wxthumb i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ai)}
.lightbox.tall{display:block;overflow:auto;-webkit-overflow-scrolling:touch;padding:0;cursor:default}
.lightbox.tall .lbbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:8px;background:rgba(8,12,16,.88);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.lightbox.tall .lbclose,.lightbox.tall .lbsave{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#E4E9EC;font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
.lightbox.tall .lbsave{background:#2F6FD6;color:#fff;font-weight:700}
.lightbox img{-webkit-touch-callout:default}
.lbsv{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:10px;height:44px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.lbsv:hover{background:rgba(255,255,255,.3)}
.lightbox.tall img{display:block;width:100%;max-width:640px;max-height:none;margin:0 auto;border-radius:0;background:#fff}
.lightbox.tall p{padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));line-height:1.7}.lightbox.tall p a{color:#9CC4FF;text-decoration:underline}
.wxgo{margin:6px 0 2px}
.wxk{margin:12px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}.wxk li{margin:2px 0}
</style>

  N("**磐梯吾妻 Skyline 管制**（福島縣 10/21 更新，出發前一晚再查）：\n"
   +"- **夜間通行止め**：2026 年自 **11/1（日）17:00** 起，每天 17:00 至隔天 08:00，直到 11/13 8:00。也就是 11/1 當天 17:00 起就封，本行程 16:45 前通過高湯閘門就是依這個設定。\n"
   +"- **冬期通行止め**：11/13（五）17:00 起（氣象狀況可能提早）。\n"
   +"- **結冰與降雪會臨時封閉**：去年 10/29 8:00 至 10/30 10:00 就曾因路面結冰全線封閉；紅葉期道路很擁擠，另有霧與部分單向交替通行。\n"
   +"- **火山氣體**：高湯閘門起算 12.8 km 處測到火山性氣體超標時，浄土平至不動沢之間會封閉。以上見 [福島縣 磐梯吾妻 Skyline 交通情報](https://www.pref.fukushima.lg.jp/sec/41310a/bandaiazumaskyline.html)。\n"

 ginzan:{q:"銀山温泉 夜景 ガス灯",kind:"景點",

 yamagata7:{q:"山形 紅の蔵 水の町屋 七日町御殿堰",kind:"景點",

 okama:{q:"蔵王 御釜 エメラルドグリーン",kind:"景點",

 ropeway:{q:"蔵王ロープウェイ 地蔵山頂駅 樹氷高原駅",kind:"景點",
  text:["從藏王溫泉搭兩段纜車上山：山麓線約 7 分鐘到海拔 1,331 m 的樹冰高原站，換乘山頂線約 10 分鐘到海拔 1,661 m 的地藏山頂站，兩段合計約 17 分鐘（不含轉乘）。官網形容沿途是 360 度的全景視野。",

        "**樹冰高原站**：換乘站，官網列的景點有いろは沼和観松平。"],

 tontei:{q:"会津 とん亭 ソースカツ丼",kind:"餐廳",
  text:["會津的庶民美食是醬汁豬排丼（ソースカツ丼）：白飯上先鋪高麗菜絲，再放上沾過特製醬汁的厚切豬排。とん亭是會津若松的人氣專門店，店內掛滿名人簽名。",
        "除了招牌豬排丼，店裡也有馬肉（桜肉）版本：會津是日本知名的馬肉產地，「桜肉」就是馬肉的雅稱。馬肉肉質細緻、脂肪少、味道清爽不腥，裹粉炸過再淋上同一款特製醬汁，口感與豬排不同，想嘗鮮的人很適合點來和豬排版本分著吃。"],
  pick:["會津こだわり丼（里肌豬排）","八重うまっ ソースかつ丼（桜肉＝馬肉版本）","點一份豬排、一份馬肉互相分享，比較兩種口感"]},
 goshiki:{q:"五色沼 毘沙門沼 コバルトブルー",kind:"景點",
  text:["1888 年磐梯山噴發後形成的大小湖沼群，因為火山礦物與光線，湖水呈現鈷藍、祖母綠、乳白等不同顏色。",
        "連接各湖的自然探勝路約 3.6 公里，平坦好走，秋天兩旁是紅黃樹林。"],
  pick:["毘沙門沼（最大，可租手划船，背景是磐梯山）","弁天沼、青沼的藍綠色湖面","探勝路沿途紅葉"]},
 skyline:{q:"磐梯吾妻スカイライン 紅葉",kind:"景點",
  text:["磐梯吾妻 Skyline 是連接福島市高湯與土湯一帶的山岳景觀道路，一路爬升到海拔約 1,600 m 的火山地帶，沿途有火山岩地形、高原與大片山坡林相。",
        "11/1 高處的紅葉多半已過季，山腰低處仍有機會看到色彩，主要以視野與火山地形為主；實際狀況與是否通行，出發前一晚再查。"],
  pick:["沿途火山岩山坡與紅葉","觀景點遠眺福島盆地","起霧或下雨時視野差，路況也要特別小心"]},
 kofuji:{q:"吾妻小富士 火口",kind:"景點",
  text:["形狀像小型富士山的火山，從淨土平停車場走約 10 分鐘階梯就能到火口邊緣，可以俯看巨大的圓形火口，繞火口一圈約 1 小時。","停車請用浄土平駐車場（汽車 ¥500）。"],
  pick:["火口邊緣俯瞰","淨土平一帶的高原景色"]},
 tengu:{q:"磐梯吾妻スカイライン 天狗の庭",kind:"景點",
  text:["磐梯吾妻 Skyline 沿線的觀景點，奇岩散布在山坡上，傳說像天狗遊玩的庭園。視野可以遠眺山谷與福島盆地，傍晚時分很適合看夕陽。","這裡沒有專用停車場，車要停在路肩，請小心來車。"],
  pick:["山谷紅葉與遠方雲海","傍晚看福島盆地"]},
 fudo:{q:"磐梯吾妻スカイライン 不動沢橋 紅葉",kind:"景點",
  text:["Skyline 上的紅褐色拱橋，橫跨在深谷之上，紅葉季節是沿線最熱門的拍照點之一。橋身與谷中的黃紅樹林搭在一起很有畫面。","停車使用つばくろ谷駐車場（免費）。"],
  pick:["橋與谷地紅葉的合照","從橋上往下看山谷"]},
  lakeresort:{q:"裏磐梯レイクリゾート 日帰り温泉",kind:"溫泉",
   text:["**■ 溫泉特色與泉質**\n・泉質：硫酸鹽泉、氯化物泉（含鐵成分）。\n・pH 約 6.8（中性），對肌膚溫和，有保濕與緊緻效果，是「美肌之湯」。\n・別稱「黃金之湯」：富含鐵質與礦物質，露天風呂常呈現自然的棕褐色或金黃色。",
         "**■ 泡湯設施**\n・**露天風呂（雪見風呂）**：緊鄰檜原湖畔，視野開闊。白天可眺望湖光山色與四季景色，秋天是紅葉，冬天可以一邊泡湯一邊賞雪。\n・**室內大浴場**：空間寬敞、乾淨舒適，和露天風呂是不同的感覺。",
         "**■ 日歸入浴**\n浴場名稱為「ひばらみの湯」「オーロラの湯」（依日期男女輪替）。13:30–21:00（最終受付 20:00），另有早上 9:00–10:30。大人 ¥1,200、小學生 ¥800、3 歲以下免費，毛巾組 ¥400。客滿或繁忙時可能限制日歸，**出發前先打電話確認：0241-37-1111**。",
         "※ 這間是依你提供的「裏磐梯湖畔渡假村」推定為「裏磐梯レイクリゾート」，名稱、設施與費用以官網與電話確認為準。"],
   pick:["金黃色的露天風呂（緊鄰檜原湖）","寬敞的室內大浴場","秋天紅葉＋湖景"]},
  nakatsugawa:{q:"中津川渓谷 磐梯吾妻レークライン 紅葉",kind:"景點",
   text:["**■ 景點簡介**\n中津川渓谷位在磐梯吾妻レークライン沿線，是福島縣內知名的紅葉景點之一。秋天峽谷兩側的樹木染成紅黃色，沿線還有落葉松林，金黃色的針葉很好拍。",
         "**■ 中津川渓谷レストハウス**\n停車場旁就是餐廳兼休息站，有免費停車場（約 50–58 台）。菜單有会津地鶏丼、ソースカツ丼、手打ちそば。營業約 08:30–16:30，TEL 0242-64-2817。",
         "**■ 注意**\n紅葉期週末停車場容易客滿，路肩與橋上禁止停車。Lakeline 為山路，日落後路暗，開車要慢。"],
   pick:["峽谷與紅葉","Lakeline 沿線的落葉松","餐廳（要在 16:30 前到）"]},
  nishimuraya:{q:"中ノ沢温泉 磐梯 西村屋 日帰り入浴",kind:"溫泉",
   text:["**■ 泉質與溫泉特色**\n・酸性、含硫黃－鈣・鋁－硫酸鹽、氯化物泉（硫化氫型），屬強酸性硫黃泉。\n・源泉名稱：沼尻元湯。\n・pH 約 2.1（強酸性），帶有濃郁的硫磺味。\n・源泉約 57℃，會加水調節溫度。\n・100% 源泉放流（源泉かけ流し）。\n・湧出量非常豐富，每分鐘約 13,400–14,000 公升。",
         "**■ 浴場設施**\n・**渓流露天風呂**：被自然景色圍繞的溪流邊露天風呂，官網寫 24 小時開放。\n・**檜木風呂、大岩風呂**：室內浴場，男女依時段輪替。",
         "**■ 日歸入浴**\n・時間：**10:00–15:00**（官網未寫最後受付時間）。\n・費用：大人 ¥700、小孩 ¥300；個室休憩（包廂休息）¥2,350。\n・定休日：你提供的資料寫週四（官網沒寫，出發前確認）。11/1 是週日。\n・強酸性泉對皮膚較刺激，泡完要沖洗，銀飾與金屬飾品會變黑，要先拿下來。\n・官網沒寫停車資訊，請打電話確認。\n・[官網 溫泉頁](https://www.bandai-nishimuraya.jp/hotsprings/)"],
   pick:["強酸性 100% 源泉放流","溪流邊露天風呂","檜木風呂、大岩風呂"]},
 tamagoyu:{q:"高湯温泉 旅館玉子湯 湯小屋",kind:"溫泉",
  text:["**■ 溫泉背景**\n高湯溫泉坐落於福島吾妻山中腹，名列「奧州三高湯」之一。開湯 400 年來皆為自然湧出，不加水、不加溫，堅持 100% 源泉放流（源泉かけ流し）。\n庭園內保留著明治元年（1868 年）創業時留存至今的茅草屋頂湯小屋「玉子湯」，已有 150 多年歷史。泉質為乳白色硫磺泉，因泉水氣味神似熟雞蛋、泡完後肌膚如白煮蛋般光滑細緻而得名。",
        "**■ 日歸開放浴池**\n除付費獨立湯屋為貸切混浴外，其餘浴池皆為男女分開：\n・茅草湯小屋「玉子湯」：歷史核心地標，男女分開。\n・庭園露天風呂「天渓の湯」：兩池採單雙日男女隔日輪替。\n・室內大浴場「滝の湯」（4F）：男女分開，備有完整淋浴清潔設施。\n・室內內湯「仙気の湯」（1F）：僅限夜之部開放；我們預計 11/1 16:50 抵達，剛好在夜之部（16:00～20:00）開放時段內，可以直接體驗。\n・戶外足湯「のんびり足湯」：穿著衣服即可自由使用。\n・貸切露天風呂「瀬音」：需自費（45 分鐘 2,200 日圓，不可預約，現場先到先排）。",
        "**■ 洗沐與動線注意事項**\n・洗沐備品：僅 4 樓「滝の湯」與 1 樓「仙気の湯」備有洗髮精、潤絲精與沐浴乳；戶外湯小屋與露天風呂純供浸泡，無清潔備品。\n　推薦泡湯順序：先至庭園體驗茅草「湯小屋」與戶外「露天風呂」感受野趣 ➔ 最後回室內「滝の湯」或「仙気の湯」沖洗全身與洗髮。\n・更衣動線：湯小屋與各露天風呂皆設有獨立脫衣棚，彼此並不相通；換場前往下一個湯池時，需穿上輕便衣物再行走移動。",
        "（※ 實際營運與男女性別輪替仍以官網最新公告及現場狀況為準）"],
  pick:["湯小屋「玉子湯」（茅草屋頂）","露天風呂「天渓の湯」（單雙日男女輪替）","滝の湯（有洗髮、沐浴備品）","仙気の湯（夜の部才開放）","貸切露天風呂「瀬音」（另付 ¥2,200 / 45 分）"]},

 sunmallst:{q:"サンモール一番町 ぶらんど〜む一番町",kind:"景點",

 coela:{q:"Maison Cœlacanthe 奶油紅豆 最中",kind:"購物",lbl:"伴手禮推薦",ic:"bag",
  text:["**Maison Cœlacanthe 奶油紅豆腔棘魚最中**\nMaison Cœlacanthe 有賣奶油紅豆腔棘魚最中（榮泉堂的商品），也是伴手禮（照片為切面）。\n營業時間：11:00–19:00",
        "**奶油紅豆最中 可買地點**\n**以下賣的是一般奶油紅豆版本，不是腔棘魚**\n・S-PAL 本館 B1 HANAGATAYA エスパル仙台（營業 10:00–20:00，[地圖](https://maps.app.goo.gl/Xx2MvpGSZmYgzGRJ7)）：據說每週一、三、五有限量進貨。單顆散賣 ¥270，6 入盒裝 ¥1,680。\n・仙台機場 2F 出境大廳「萩」（[地圖](https://maps.app.goo.gl/xEzwfsZJaEBQYeRn7)）：6 入盒裝 ¥1,600，但數量有限；怕買不到的話，去 HANAGATAYA 會比較保險。位置見照片。",
        "**腔棘魚版本 可買地點**\n・カズノリイケダ アンディヴィデュエル エスパル仙台店（營業 10:00–20:00，[地圖](https://maps.app.goo.gl/iAJ71VygCHNLvHTT7)）：要開門就去買比較容易買到，現購兩盒。"],
  pick:[]},
 "om-where":{q:"仙台機場 2F 伴手禮 萩",kind:"購物",lbl:"購買地點",ic:"bag",

  pick:[]},
 "om-calbee":{q:"Calbee 青森富士蘋果乾 仙台機場",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**Calbee 青森富士蘋果乾**\n青森縣產「ふじ」蘋果做成的蘋果乾（包裝寫青森縣產富士 100%）。用不油炸的乾燥製法、不加糖，連皮切成小丁，口感外脆內酥。\n**購買地點**\n・**仙台機場**：2F 出境大廳「萩」（[地圖](https://maps.app.goo.gl/xEzwfsZJaEBQYeRn7)）"],
  pick:[]},
 "om-kikufuku":{q:"喜久水庵 喜久福 冷凍鮮奶油冰大福",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**喜久水庵 喜久福（冷凍鮮奶油冰大福）**\n喜久水庵（お茶の井ヶ田）的招牌和菓子，薄薄的麻糬皮包著輕盈的鮮奶油，是仙台伴手禮的老面孔。口味有抹茶、毛豆泥鮮奶油、鮮奶油、焙茶等，抹茶最受歡迎。冷凍販售，自然解凍約 1 小時最好吃，也可以半解凍吃冰涼口感；解凍後要冷藏、48 小時內吃完。"],
  pick:[]},
 "om-hagi":{q:"萩の月 仙台",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**萩の月**\n菓匠三全的招牌，蓬鬆的蛋糕體包著卡士達奶油，名字取自宮城野的萩花和浮在上面的月亮。一個一個包裝、常溫保存，是仙台最經典的伴手禮。8 入約 ¥2,120。"],
  pick:[]},
 "om-sasa":{q:"笹蒲鉾 仙台 魚板",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**笹蒲鉾（魚板）**\n笹蒲鉾是把魚漿做成竹葉形狀烤熟的仙台名物，口感彈牙。照片的包裝是宮城縣南三陸町的及善蒲鉾店（包裝寫創業明治十三年）。這家的常溫款用加壓加熱殺菌、不加防腐劑，有原味、牛舌、章魚三種口味，適合帶上飛機。"],
  pick:[]},
 "om-zsand":{q:"毛豆泥奶昔 巧克力夾心餅乾 仙台",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**毛豆泥奶昔巧克力夾心餅乾**\n喜久水庵招牌飲品「ずんだシェイク」做成的巧克力夾心餅乾：用含毛豆泥粉的餅乾，夾著霜淇淋風味的鮮奶油巧克力，一片一片獨立包裝。6 入約 ¥864（官網價）。"],
  pick:[]},
 "om-zmochi":{q:"ずんだ茶寮 ずんだ餅",kind:"購物",lbl:"介紹",ic:"bag",
  text:["**ずんだ茶寮 毛豆泥麻糬（ずんだ餅）**\nずんだ茶寮（菓匠三全）的毛豆泥麻糬：用嚴選毛豆調配成餡，香氣濃、味道深。除了冷凍款，也有常溫可攜帶的款式，把麻糬包上毛豆餡、做成好入口的大小。"],

function collectMoves(items,out,dayN){
  items.forEach((it,i)=>{

}

function renderCost(){
  const sum = BUDGET.reduce((a,r)=>[a[0]+r[1],a[1]+r[2],a[2]+r[3],a[3]+r[4]],[0,0,0,0]);
  const jp = sum[0]+sum[1]+sum[2]+sum[3]+RENTAL+BREAKFAST;
  const all = FLIGHT_TWD + jp*RATE;
  const parts = [
    ["機票",FLIGHT_TWD,"var(--ink)"],
    ["住宿",sum[3]*RATE,"var(--ai)"],
    ["餐飲",(sum[2]+BREAKFAST)*RATE,"var(--momiji)"],
    ["租車",RENTAL*RATE,"var(--kin)"],
    ["門票・泡湯",sum[1]*RATE,"var(--mountain-3)"],
    ["油資・通行費・停車・電車",sum[0]*RATE,"var(--muted)"]

  let h = `<div class="sec"><h2>預算</h2><p class="lead">4 人合計，以 1 日圓 ≈ NT$${RATE} 概估；預設排法 A，不含購物。</p>

  <div class="split" role="img" aria-label="花費比例">`+parts.map(p=>`<i style="flex:${p[1]};background:${p[2]}"></i>`).join("")+`</div>
  <ul class="legend">`+parts.map(p=>`<li><b style="background:${p[2]}"></b><span>${p[0]}</span><span class="v">${twd(p[1])}</span></li>`).join("")+`</ul>`;
  h += `<h3>日本當地每日花費（日圓）</h3><div class="tscroll"><table><thead><tr><th>日期</th><th>交通</th><th>門票・泡湯</th><th>餐飲</th><th>住宿</th><th>合計</th></tr></thead><tbody>`;
  BUDGET.forEach(r=>{h+=`<tr><td>${r[0]}</td><td>${r[1].toLocaleString()}</td><td>${r[2].toLocaleString()}</td><td>${r[3].toLocaleString()}</td><td>${r[4].toLocaleString()}</td><td>${(r[1]+r[2]+r[3]+r[4]).toLocaleString()}</td></tr>`});
  h += `<tr><td>租車</td><td>${RENTAL.toLocaleString()}</td><td></td><td></td><td></td><td>${RENTAL.toLocaleString()}</td></tr>`;

  h += `<tr class="sum"><td>合計</td><td>${(sum[0]+RENTAL).toLocaleString()}</td><td>${sum[1].toLocaleString()}</td><td>${(sum[2]+BREAKFAST).toLocaleString()}</td><td>${sum[3].toLocaleString()}</td><td>${jp.toLocaleString()}</td></tr></tbody></table></div>
  <p class="sub">日本當地 ${yen(jp)}（每人約 ${yen(Math.round(jp/4))}），約 ${twd(jp*RATE)}；機票 ${twd(FLIGHT_TWD)}。</p>`;
  h += `<h3>排法 B 與選配</h3><div class="box"><ul class="plain">
   <li>10/30 走排法 B（不上御釜）：少刈田リフト 4 人 ¥4,000。</li>

   <li>Day 5 選鶴ヶ城：門票 4 人 ¥2,080，停車約少 ¥300。</li></ul></div>`;
  h += `<h3>估算方式</h3><div class="box"><ul class="plain">
   <li>油資：全程約 930 km，以 ¥13,000 估。通行費依各日註記。</li>
   <li>停車：依提供的費率；鳴子峽、大內宿各 ¥500，藏王、五色沼、昭和館、只見川免費。</li>
   <li>餐飲：午餐每人 ¥1,200–1,800、拉麵蕎麥麵晚餐 ¥1,500–2,500、牛舌約 ¥4,000、米澤牛以每人 ¥10,000 估。</li>
   <li>門票：立石寺 ¥500/人、刈田リフト ¥1,000/人、藏王纜車 ¥4,400/人、大露天風呂 ¥850、七乃湯 ¥2,000、玉子湯 ¥1,300。</li>
   <li>匯率：台灣銀行 2026/06 日圓現鈔賣出價約 0.2008，以 0.205 概估。</li>
   <li>不含：HOKA 鞋、伴手禮、保險、網路、台灣機場往返。</li></ul></div></div>`;
  document.getElementById("v-cost").innerHTML = h;
}

const KX = Math.cos(38*Math.PI/180), MW = 360, MH = 440;
function fitView(pts,minSpan,pad){
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  pts.forEach(p=>{a=Math.min(a,p.lat);b=Math.max(b,p.lat);c=Math.min(c,p.lon);d=Math.max(d,p.lon)});
  const cl=(a+b)/2, cn=(c+d)/2;
  let hl=Math.max(b-a,minSpan)/2, hn=Math.max(d-c,minSpan/KX)/2;
  const s=Math.min((MW-2*pad)/(2*hn*KX),(MH-2*pad)/(2*hl));
  return {s,cl,cn};
}
function proj(v,lat,lon){return [MW/2+(lon-v.cn)*KX*v.s, MH/2-(lat-v.cl)*v.s];}
function dayColor(n){return `var(--d${n})`;}

function arcPts(a,b,bow,n){

  for(let i=0;i<=n;i++){ const t=i/n, o=Math.sin(Math.PI*t)*bow*L;
    out.push([a.lat+dy*t+py*o, a.lon+dx*t+px*o]); }
  return out;
}

function flightInset(rev){
  const W=118,H=140,X=MW-W-8,Y=8, a={lat:25.0777,lon:121.2322}, b=PT.sdj;
  const s0=(W-14)/((142.4-119.6)*KX), mp=(la,lo)=>[X+7+(lo-119.6)*KX*s0, Y+7+(41.3-la)*s0], F=x=>x.toFixed(1);
  let g=`<g class="finset"><rect x="${X}" y="${Y}" width="${W}" height="${H}" rx="8" fill="var(--sea)" stroke="var(--line)"/>`;
  [OUT_TW,OUT_HONSHU,OUT_KYUSHU,OUT_SHIKOKU].forEach(poly=>{ g+=`<polygon points="${poly.map(([lo,la])=>mp(la,lo).map(F).join(",")).join(" ")}" fill="var(--land)" stroke="var(--line)" stroke-width=".6"/>`; });
  const pts=arcPts(a,b,0.12,30).map(([la,lo])=>mp(la,lo));

  const e=rev?pts[0]:pts[30], f=rev?pts[3]:pts[27], ang=Math.atan2(e[1]-f[1],e[0]-f[0]);
  g+=`<path d="M${F(e[0])} ${F(e[1])}l${F(-6*Math.cos(ang-.5))} ${F(-6*Math.sin(ang-.5))}M${F(e[0])} ${F(e[1])}l${F(-6*Math.cos(ang+.5))} ${F(-6*Math.sin(ang+.5))}" stroke="${col}" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  const t=mp(a.lat,a.lon), j=mp(b.lat,b.lon);

function mapChips(){

  // routes
  days.forEach(n=>{
    const pts=routeFor(n).filter(k=>!PT[k].off).map(k=>proj(v,PT[k].lat,PT[k].lon));
    s+=`<polyline points="${pts.map(p=>p.map(F).join(",")).join(" ")}" fill="none" stroke="${dayColor(n)}" stroke-width="${mapState.day?3:2.2}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${mapState.day?"7 5":"0"}" opacity="${mapState.day?0.9:0.75}"/>`;

    keys.forEach((k,i)=>{ if(seen[k]) seen[k].nums.push(i+1); else {seen[k]={k,nums:[i+1]};order.push(seen[k]);} });
    const placed=[];
    order.forEach(o=>{
      if(PT[o.k].off) return;

      placed.push([x,y]);

/* ================= LEAFLET (real basemap; falls back to the schematic SVG if offline) ================= */
let LM=null, LMEL=null, LLAYER=null, LMDAY=-1, LLOAD=0;
function lcolor(n){return (getComputedStyle(document.documentElement).getPropertyValue("--d"+n)||"").trim()||"#c0392b";}
function loadLeaflet(){
  if(LLOAD) return; LLOAD=1;
  const sc=document.createElement("script");
  sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  sc.onload=()=>{ if(state.view==="map") mountLeaflet(); };
  sc.onerror=()=>{ LLOAD=2; };
  document.head.appendChild(sc);
}
document.addEventListener("click",e=>{ if(e.target.closest("[data-flfit]")&&LM&&window.L){ LM.fitBounds(L.latLngBounds([[TPE.lat,TPE.lon],[PT.sdj.lat,PT.sdj.lon]]),{padding:[40,40]}); } });
function updLab(){ if(LM&&LMEL) LMEL.classList.toggle("hidelab",LM.getZoom()<11); }
function mountLeaflet(){
  const slot=document.getElementById("lmapslot"); if(!slot) return;
  if(!window.L){ loadLeaflet(); return; }   // SVG fallback stays visible meanwhile
  try{
    if(!LMEL){ LMEL=document.createElement("div"); LMEL.id="lmap"; }
    slot.replaceWith(LMEL);
    if(!LM){
      LM=L.map(LMEL,{zoomControl:true,attributionControl:true}).setView([38.0,140.4],8);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(LM);
      LLAYER=L.layerGroup().addTo(LM);
      LM.on("zoomend",updLab);
    }
    LM.invalidateSize();
    LLAYER.clearLayers();
    const days = mapState.day ? [mapState.day] : [1,2,3,4,5,6,7,8];
    const all=[];
    days.forEach(n=>{
      const keys=routeFor(n), col=lcolor(n), ll=keys.filter(k=>!PT[k].off).map(k=>[PT[k].lat,PT[k].lon]);
      ll.forEach(p=>all.push(p));
      L.polyline(ll,{color:col,weight:mapState.day?4:3,opacity:mapState.day?0.85:0.75,dashArray:mapState.day?"9 7":null}).addTo(LLAYER);
      if(mapState.day && keys.some(k=>PT[k].off)) L.polyline(arcPts(TPE,PT.sdj,0.12,60),{color:col,weight:3,opacity:0.8,dashArray:"3 9"}).addTo(LLAYER);
      if(mapState.day){
        const seen={},order=[];
        keys.forEach((k,i)=>{ if(seen[k]) seen[k].nums.push(i+1); else {seen[k]={k,nums:[i+1]};order.push(seen[k]);} });
        order.forEach((o,oi)=>{
          const sel=mapState.sel===o.k;
          const html=`<div class="lmw${oi%2?" left":""}${sel?" selw":""}"><span class="lmk${sel?" sel":""}" style="background:${col}">${o.nums.join("·")}</span><span class="lml">${esc(PT[o.k].name)}</span></div>`;
          const icon=L.divIcon({className:"lmkw",html,iconSize:[0,0]});
          L.marker([PT[o.k].lat,PT[o.k].lon],{icon,title:PT[o.k].name,keyboard:true,zIndexOffset:sel?1000:0}).addTo(LLAYER).on("click",()=>{mapState.sel=o.k;renderMap();});
        });
      } else {
        const u={};
        keys.forEach(k=>{ if(u[k]||PT[k].off)return; u[k]=1;
          L.circleMarker([PT[k].lat,PT[k].lon],{radius:6,color:"#fff",weight:1.5,fillColor:col,fillOpacity:1}).addTo(LLAYER)
            .bindTooltip(`D${n} ${PT[k].name}`).on("click",()=>{mapState.day=n;mapState.sel=null;renderMap();});
        });
      }
    });
    if(LMDAY!==mapState.day){
      LMDAY=mapState.day;
      if(all.length) LM.fitBounds(L.latLngBounds(all),{padding:[30,30],maxZoom:14});
    } else if(mapState.sel && PT[mapState.sel]){
      LM.panTo([PT[mapState.sel].lat,PT[mapState.sel].lon]);
    }
    updLab();
    setTimeout(()=>{ if(LM){ LM.invalidateSize(); updLab(); } },60);
  }catch(err){ console.error("leaflet failed",err); }
}

const PREP=new Map();
function prepImg(src,name){
  let o=PREP.get(src); if(o) return o;
  o={file:null};
  o.p=(async()=>{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
    const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
    const fn=(name||"photo").replace(/[\\/:*?"<>|\s]+/g,"_")+".jpg";
    o.file=new File([blob],fn,{type:"image/jpeg"}); return o.file;
  })().catch(e=>{PREP.delete(src);throw e;});
  PREP.set(src,o); return o;
}

function dlFile(file){const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
async function saveImg(src,name,btn){
  const o=prepImg(src,name);
  const go=f=>{
    if(DLNS){ return DLNS.save({filename:f.name,data:f}).catch(e=>{ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited") return; try{ window.open(src,"_blank"); }catch(_){} }); }
    if(navigator.canShare && navigator.canShare({files:[f]})){
      return navigator.share({files:[f]}).catch(e=>{ if(!(e&&e.name==="AbortError")) dlFile(f); });
    }
    dlFile(f);
  };
  if(o.file){ go(o.file); return; }
  const old=btn?btn.textContent:""; if(btn) btn.textContent="準備中…";
  try{ const f=await o.p; if(btn) btn.textContent=old; go(f); }
  catch(e){ if(btn) btn.textContent=old; try{ window.open(src,"_blank"); }catch(_){} }
}

  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
